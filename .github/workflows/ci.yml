name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bbl
          POSTGRES_PASSWORD: bbl
          POSTGRES_DB: bbl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bbl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://bbl:bbl@localhost:5432/bbl_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and database tests
        run: pnpm test
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 14
